<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-label="Features: speak your answers, adaptive follow-ups, deterministic scoring, four interviewer roles, resume and job description, private by design">
<g transform="translate(0,0)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">1</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">Speak your answers</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">Interviewer talks, you answer by voice</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">or typing</text></g>
<g transform="translate(430,0)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">2</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">Adaptive follow-ups</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">10 main questions plus follow-ups on</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">weak answers</text></g>
<g transform="translate(860,0)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">3</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">Deterministic scoring</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">Fixed rubric, so the same answer gets</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">the same score</text></g>
<g transform="translate(0,165)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">4</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">4 interviewer roles</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">Different styles that change how</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">questions are asked</text></g>
<g transform="translate(430,165)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">5</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">Resume &amp; job description</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">Questions tailored to your background</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">and target role</text></g>
<g transform="translate(860,165)"><rect x="0" y="0" width="410" height="150" rx="18" fill="#F8F4EC" stroke="#E4DCCB"/><circle cx="50" cy="52" r="26" fill="#0B1F3B"/><text x="50" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#F4C992">6</text><text x="92" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="23" font-weight="700" fill="#0B1F3B">Private by design</text><text x="30" y="98" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">Your key and data stay on your</text><text x="30" y="122" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#376A90">computer</text></g>
