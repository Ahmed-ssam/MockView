# Local full stack: docker compose up --build
# Put secrets in a root .env file (see backend/.env.example, frontend/.env.example).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: mockview, POSTGRES_PASSWORD: mockview, POSTGRES_DB: mockview }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U mockview"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql+psycopg://mockview:mockview@db:5432/mockview
      CORS_ORIGINS: http://localhost:3000
      APP_ENV: production
      LLM_PROVIDER: ${LLM_PROVIDER:-demo}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on: [backend]
    ports: ["3000:3000"]
volumes: { pgdata: {} }
